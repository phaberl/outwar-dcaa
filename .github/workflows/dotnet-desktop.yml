name: .NET Core Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Restore dependencies (Switches to the correct directory first)
    - name: Restore dependencies
      run: dotnet restore
      working-directory: server/src/DCT

    # Build and Publish directly to a standalone EXE
    - name: Publish Standalone EXE
      run: dotnet publish -c ${{ matrix.configuration }} -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PublishReadyToRun=true -o ./publish
      working-directory: server/src/DCT

    # Upload the EXE so you can download it from GitHub
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DCT-${{ matrix.configuration }}
        path: server/src/DCT/publish/