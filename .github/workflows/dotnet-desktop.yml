name: .NET Core Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      Solution_Name: src/DCT/DCT.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore ${{ env.Solution_Name }}

    # Build and Publish directly to a single EXE file
    - name: Publish Standalone EXE
      run: dotnet publish ${{ env.Solution_Name }} -c ${{ matrix.configuration }} -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PublishReadyToRun=true -o ./publish

    # Upload the EXE so you can download it from GitHub
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DCT-${{ matrix.configuration }}
        path: ./publish/
        